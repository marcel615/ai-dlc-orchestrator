openapi: 3.0.3
info:
  title: '[프로젝트 API 이름]'
  version: '[API 버전]'
  description: >-
    초기 작성 양식이다. 프로젝트에서 작성·검토·승인하기 전에는 공식 계약이 아니다.
    API 경로, 인증 방식, 요청·응답 및 오류를 결정한 뒤 paths와 components에 작성한다.
    인증·세션 정책은 프로젝트의 인증 정책 명세를 참고한다.
paths: {}
# 필요한 경우 servers, tags, components와 security를 추가한다.
# 각 작업에 경로·메서드, 파라미터, 요청 본문, 응답 상태와 스키마를 기록한다.
