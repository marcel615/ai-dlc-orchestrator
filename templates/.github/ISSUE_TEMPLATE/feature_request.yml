
name: 공통 기능 요청
description: 프로젝트 공통 기능의 목적과 범위, 완료 조건을 정의하는 Parent Issue
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        프로젝트 전체 관점에서 기능을 정의하는 Parent Issue 양식입니다.
        실제 구현 작업은 필요한 저장소의 Sub-issue로 분리합니다.
        중요한 요구사항·계약 변경은 사용자 승인 없이 확정하지 않습니다.

  - type: textarea
    id: background
    attributes:
      label: 배경 및 목적
      description: 해결하려는 문제와 기능이 필요한 이유를 작성합니다.
      placeholder: |
        - 배경:
        - 해결할 문제:
        - 기대 효과:
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: 요구사항
      description: 사용자 관점의 주요 동작과 필요한 조건을 작성합니다.
      placeholder: |
        - 요구사항 1:
        - 요구사항 2:
        - 요구사항 3:
    validations:
      required: true

  - type: checkboxes
    id: implementation_roles
    attributes:
      label: 예상 구현 대상
      description: 필요한 역할만 선택합니다. 최종 작업 범위는 정제 과정에서 확정합니다.
      options:
        - label: Backend
        - label: Frontend
        - label: 공통 명세·계약
        - label: 추가 확인 필요

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함·제외 범위 및 예상 구현 작업을 구분합니다.
      placeholder: |
        포함:
        -

        제외:
        -

        예상 Sub-issue:
        -
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      description: 구현뿐 아니라 필요한 계약 반영과 통합 검증 기준을 작성합니다.
      placeholder: |
        - [ ] 필요한 구현 작업 완료
        - [ ] 관련 공식 명세·계약 반영
        - [ ] 필요한 통합 검증 완료
    validations:
      required: true

  - type: textarea
    id: contracts
    attributes:
      label: 관련 공식 명세 및 계약
      description: 해당하는 공식 원본 URL과 확인한 SHA를 기록합니다.
      placeholder: |
        - 요구사항:
        - API:
        - 인증:
        - ERD:
        - UI:
        - 확인한 commit SHA:

  - type: textarea
    id: dependencies
    attributes:
      label: 관련 작업 및 의존성
      description: 기존 Issue·PR·Sub-issue와 실제 선행 조건을 기록합니다.
      placeholder: |
        - 후보 출처 / Candidate ID:
        - 승인 출처:
        - 기존 작업:
        - 선행 조건:
        - 관련 PR:

  - type: textarea
    id: decisions
    attributes:
      label: 미결정 사항
      description: 사용자 판단이 필요한 사항과 결정 출처를 기록합니다.
      placeholder: |
        - 미결정 사항:
        - 필요한 결정:
        - 결정 출처:
