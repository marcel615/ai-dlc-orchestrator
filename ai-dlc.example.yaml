# Orchestrator AI-DLC 프로젝트별 설정 예시
# 이 파일과 상대 경로는 선택된 대상 프로젝트 루트 기준이다.
# 테스트가 필요한 작업에는 대상 설정의 확인된 테스트 명령을 사용한다. 미설정 시 추측하지 않는다.
# 이 파일을 ai-dlc.yaml로 복사한 뒤 프로젝트에 맞게 수정한다.
# 설정 키 이름은 유지하고, [변경 필요] 항목은 교체하며 [확인 필요] 항목은 실제 환경과 대조한다.
# 작업 범위와 결정 권한은 AGENTS.md를 따른다.

schema_version: 2

# [변경 필요] 실제 서비스 식별자
# 예: askteacher, myblog, shoppingmall
# 반드시 아래 services의 키와 일치해야 한다.
active_service: example

# Orchestrator가 실제로 설치되어 운영되는 GitHub 저장소
orchestrator:
  # [변경 필요] 예: marcel615/Ask-Teacher-specs
  # 공통 템플릿 저장소가 아닌 실제 설치 대상 저장소를 입력한다.
  repository: example-user/example-specs

  # [변경 필요] Orchestrator 운영 기준 브랜치
  default_branch: main

services:
  # [변경 필요] 위 active_service와 동일한 이름
  # 예: active_service: myblog → services.myblog
  example:

    # GitHub 저장소
    repositories:
      # 공식 명세와 공통 Parent Issue를 관리하는 저장소
      common:
        enabled: true
        # [변경 필요] 예: marcel615/Ask-Teacher-specs
        repository: example-user/example-specs
        # [변경 필요] 해당 저장소의 기준 브랜치
        default_branch: main

      # Backend 구현 저장소
      backend:
        # [확인 필요] 실제 Backend 저장소 사용 여부
        enabled: true
        # [변경 필요] 예: marcel615/Ask-Teacher
        repository: example-user/example-backend
        # [변경 필요] 해당 저장소의 기준 브랜치
        default_branch: develop

      # Frontend 구현 저장소
      frontend:
        # [확인 필요] 실제 Frontend 저장소 사용 여부
        enabled: true
        # [변경 필요] 예: marcel615/Ask-Teacher-react
        repository: example-user/example-frontend
        # [변경 필요] 해당 저장소의 기준 브랜치
        default_branch: develop

        # [확인 필요] 실제 연결 검증 후에만 활성화
        # connection_status: verified

    # 공통 백로그 및 Parent/Sub-issue 관리
    backlog:
      # 기능 후보 발굴 Skill
      draft_skill: feature-discovery

      # 승인된 후보 정제 Skill
      refinement_skill: cross-project-backlog-refinement

      # [확인 필요] Parent Issue를 생성할 저장소 역할
      # repositories에 정의된 역할 중 선택한다.
      parent_repository_role: common

      # [확인 필요] 구현 Sub-issue를 생성할 저장소 역할
      # 실제 구현에 사용하는 저장소만 포함한다.
      implementation_repository_roles:
        - backend
        - frontend

      # GitHub 공식 Sub-issue 관계 사용
      relationship: github-sub-issue

    # GitHub Projects
    project:
      # [변경 필요] Project를 소유한 사용자 또는 조직
      owner: example-user

      # [변경 필요] Project URL의 마지막 번호
      number: 1

      # [변경 필요] GitHub Projects의 GraphQL ID
      # 예: PVT_kwHOA3_2Ds4BqsK-
      id: REPLACE_WITH_PROJECT_ID

      # [변경 필요] 실제 Project 주소
      # 조직 Project라면 /orgs/조직명/projects/번호
      url: https://github.com/users/example-user/projects/1

      # [확인 필요] 실제 Project의 필드 이름
      # 왼쪽 키는 유지하고 오른쪽 필드 이름을 확인한다.
      fields:
        status: Status
        approval: Approval
        proposer: Proposer
        candidate_id: Candidate ID
        priority: Priority
        target_date: Target date
        parent_issue: Parent issue
        sub_issues_progress: Sub-issues progress

      # [확인 필요] Status 필드의 실제 선택지 이름
      statuses:
        backlog: Backlog
        ready: Ready
        in_progress: In Progress
        in_review: In Review
        done: Done

      # [확인 필요] 각 필드의 실제 선택지 이름
      approval_values:
        pending: Pending
        approved: Approved
        hold: Hold
        rejected: Rejected

      proposer_values:
        user: User
        ai: AI

      priority_values:
        high: High
        medium: Medium
        low: Low

    # GitHub Issue 라벨
    # [확인 필요] 실제 저장소에 아래 라벨이 존재해야 한다.
    # 없으면 같은 이름으로 생성하거나 기존 라벨에 맞게 수정한다.
    # 왼쪽 설정 키(decision, high 등)는 변경하지 않는다.
    labels:
      decision: 'needs: decision'
      priority:
        high: 'priority: high'
        medium: 'priority: medium'
        low: 'priority: low'

    # 공식 요구사항
    requirements:
      # [확인 필요] 공식 원본이 있는 저장소 역할
      repository_role: common

      # [확인 필요] 실제 문서 경로와 형식
      path: docs/requirements.md
      format: markdown

      # [선택] 확인한 명세의 조사 기준 커밋
      # reference_commit: 실제_확인한_커밋_SHA

    # 공식 API·인증·DB·UI 계약
    contracts:
      api:
        # [확인 필요] 공식 API 명세의 위치와 형식
        repository_role: common
        path: docs/api-spec.md
        format: markdown
        # reference_commit: 실제_확인한_커밋_SHA

      authentication:
        # [확인 필요] 인증 명세의 위치와 섹션
        repository_role: common
        path: docs/api-spec.md
        section: 인증
        format: markdown
        # reference_commit: 실제_확인한_커밋_SHA

      erd:
        # [확인 필요] 공식 ERD의 위치와 형식
        repository_role: common
        path: docs/erd.md
        format: markdown
        # reference_commit: 실제_확인한_커밋_SHA

      ui:
        # [확인 필요] 공식 UI 명세의 위치와 형식
        repository_role: common
        path: docs/ui-spec.md
        format: markdown
        # reference_commit: 실제_확인한_커밋_SHA

    # PR 변경 영향 분석 상태
    review:
      # [확인 필요] 최신 분석 상태를 저장할 JSON 경로
      # 새 프로젝트에서는 빈 초기 상태 파일을 사용한다.
      state_file: integration-review-state.json

# 적용 전 체크:
# 1. [변경 필요] 항목은 반드시 실제 프로젝트 값으로 교체한다.
# 2. [확인 필요] 항목은 실제 환경과 비교하고, 일치하면 유지하고 다르면 수정한다.
# 3. active_service와 services의 키가 일치하는지 확인한다.
# 4. Orchestrator 및 연결 저장소의 주소·기준 브랜치·접근 권한을 확인한다.
# 5. GitHub Project의 필드·선택지와 Issue 라벨이 실제로 존재하는지 확인한다.
#    없는 필드·라벨은 생성하거나 설정을 실제 값에 맞게 수정한다.
# 6. Parent/Sub-issue 생성 대상 및 GitHub 공식 관계 지원을 확인한다.
# 7. 공식 요구사항·계약의 저장소·브랜치·파일 경로와 접근 권한을 확인한다.
# 8. connection_status는 실제 연결 검증 후 기록한다.
# 9. reference_commit은 선택 항목이며, 실제 확인한 커밋만 기록한다.
# 10. 토큰·비밀번호·API 키 등 비밀값은 기록하지 않는다.

# requirements와 contracts는 역할의 default_branch에서 공식 원본을 조회한다.
# reference_commit은 조사 기준이며 현재 계약 버전을 고정하지 않는다.
# 실행 시 현재 브랜치 SHA를 확인하고 원본 URL·SHA를 기록한다.
# 구현 저장소의 명세 사본은 공식 원본을 대체하지 않는다.
# default_branch 설정만으로 파일·커밋 존재나 연결 완료가 보장되지는 않는다.
